name: Red Ventures
description: 'Red Ventures is a privately held digital marketing and media holding company headquartered
  in Fort Mill, South Carolina, operating a portfolio of high-growth consumer comparison, commerce,
  education, and content businesses including Bankrate, The Points Guy, Lonely Planet, Allconnect,
  Sage Home Loans, RV Education, and RV Home Client Services. The company combines proprietary
  technology, data science, and performance marketing to acquire customers on behalf of its brands
  and partners. It maintains a public GitHub organization of 77 largely-forked internal engineering
  repositories and a company blog, but publishes no public developer API program: there is no developer
  portal, API reference, OpenAPI/AsyncAPI/GraphQL contract, first-party SDK, or served /.well-known/
  discovery document on any Red Ventures-controlled host.'
